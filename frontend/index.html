<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedControl - Gerenciador de Medicamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>💊 MedControl</h1>
            <p>Gerencie seus horários com facilidade</p>
        </header>

        <main>
            <section class="form-section">
                <h2>Adicionar Medicamento</h2>
                <form id="form-medicamento">
                    <div class="input-group">
                        <label for="nome">Nome do Medicamento</label>
                        <input type="text" id="nome" placeholder="Ex: Ibuprofeno" required>
                    </div>

                    <div class="input-group">
                        <label for="dosagem">Dosagem</label>
                        <input type="text" id="dosagem" placeholder="Ex: 600mg" required>
                    </div>

                    <div class="input-group">
                        <label for="horario">Horário</label>
                        <input type="time" id="horario" required>
                    </div>

                    <div class="input-group">
                        <label for="observacoes">Observações (opcional)</label>
                        <textarea id="observacoes" placeholder="Ex: Tomar após as refeições"></textarea>
                    </div>

                    <button type="submit" id="btn-adicionar">+ Adicionar</button>
                </form>
            </section>

            <section class="lista-section">
                <h2>Meus Medicamentos</h2>
                <div id="lista-medicamentos">
                    <p class="loading">Carregando medicamentos...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
