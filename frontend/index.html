<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedControl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💊 MedControl</h1>
            <p>Gerencie seus horários com facilidade</p>
        </header>

        <section class="form-section">
            <h2>Adicionar Medicamento</h2>
            <form id="form-medicamento">
                <input type="text" id="nome" placeholder="Nome do Medicamento" required>
                <input type="text" id="dosagem" placeholder="Dosagem (ex: 600mg)" required>
                <input type="time" id="horario" required>
                <textarea id="observacoes" placeholder="Observações (opcional)"></textarea>
                <button type="submit">+ Adicionar</button>
            </form>
        </section>

        <section class="lista-section">
            <h2>Meus Medicamentos</h2>
            <div id="lista-medicamentos">
                <p>Carregando...</p>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
